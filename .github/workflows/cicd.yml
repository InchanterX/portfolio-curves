name: Build and publish components

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      component:
        description: Component to build
        type: choice
        default: auto
        options: [auto, all, migrations, collector-job, metabase]

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.changes.outputs.matrix }}
      has_changes: ${{ steps.changes.outputs.has_changes }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select components
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          SOURCE_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          COMPONENT: ${{ inputs.component || 'auto' }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          if [[ "$EVENT" != pull_request && "$SOURCE_REF" != refs/heads/main ]]; then
            echo 'Publishing is only supported from main.' >&2
            exit 1
          fi
          matrix=$(python .github/scripts/detect-changes.py --event "$EVENT" \
            --revision "$SOURCE_SHA" --base "$BASE_SHA" --component "$COMPONENT")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "has_changes=$(jq '.include | length > 0' <<< "$matrix")" >> "$GITHUB_OUTPUT"

  integration:
    needs: detect
    if: >-
      contains(fromJSON(needs.detect.outputs.matrix).include.*.name, 'migrations') ||
      contains(fromJSON(needs.detect.outputs.matrix).include.*.name, 'collector-job')
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: curves_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d curves_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_DSN: postgresql://postgres:test-password@localhost:5432/curves_db
      COLLECTOR_TEST_DSN: postgresql://postgres:test-password@localhost:5432/curves_db
      PGPASSWORD: test-password
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.9.7'
      - name: Prepare schema and roles
        run: |
          psql -h localhost -U postgres -d curves_db -c 'CREATE ROLE metabase_reader; CREATE ROLE curves_collector; CREATE ROLE curves_migrator;'
          uv run --project migrations --locked curves-migrate upgrade
          psql -h localhost -U postgres -d curves_db -f migrations/src/curves_migrations/grants.sql -v ON_ERROR_STOP=1
      - name: Check collector with PostgreSQL
        run: uv run --project collector_job --locked pytest collector_job/tests -m integration -q

  build:
    needs: [detect, integration]
    if: always() && needs.detect.outputs.has_changes == 'true' && (needs.integration.result == 'success' || needs.integration.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        if: matrix.name == 'migrations' || matrix.name == 'collector-job'
        with:
          version: '0.9.7'
      - name: Check migrations
        if: matrix.name == 'migrations'
        run: |
          uv run --project migrations --locked ruff check migrations
          uv run --project migrations --locked pytest migrations/tests -m 'not integration' -q
      - name: Check collector
        if: matrix.name == 'collector-job'
        run: |
          uv run --project collector_job --locked ruff check collector_job
          uv run --project collector_job --locked pytest collector_job/tests -m 'not integration' -q
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        if: github.event_name != 'pull_request'
        with:
          registry: registry.faberge-eggs.ru
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ matrix.image }}:sha-${{ github.sha }}
            ${{ matrix.image }}:latest
          build-args: |
            MB_EDITION=oss
            VERSION="v0.65.0-curves.${{ github.sha }}"
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope={0}', matrix.name) || '' }}

  update-dev:
    needs: [detect, build]
    if: github.event_name != 'pull_request' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: gitops-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Update dev tags
        env:
          MATRIX: ${{ needs.detect.outputs.matrix }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git fetch origin main
          while read -r context; do
            git diff --quiet "$SOURCE_SHA" origin/main -- "$context" \
              .github/scripts/detect-changes.py .github/workflows/cicd.yml || {
              echo 'Sources changed during build; run auto for current main.' >&2
              exit 1
            }
          done < <(jq -r '.include[].context' <<< "$MATRIX")
          git checkout --detach origin/main
          while read -r component; do
            file="kustomization/$component/overlays/dev/kustomization.yaml"
            sed -i -E "s/^([[:space:]]*newTag:).*/\1 sha-$SOURCE_SHA/" "$file"
            sed -i '/^[[:space:]]*digest:/d' "$file"
            git add -- "$file"
          done < <(jq -r '.include[].name' <<< "$MATRIX")
          git diff --cached --quiet && exit 0
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'chore(gitops): update dev image tags'
          git push origin HEAD:main
