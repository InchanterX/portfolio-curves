apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapi-service
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: webapi-service
      app.kubernetes.io/part-of: curves
  template:
    metadata:
      labels: *id001
    spec:
      serviceAccountName: app
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
      - name: app
        image: registry.faberge-eggs.ru/curves/webapi-service:latest
        imagePullPolicy: Always
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 512Mi
        env:
        - name: PG_USER
          value: curves
        - name: PG_HOST
          value: postgres
        - name: PG_PORT
          value: '5432'
        - name: PG_DB
          value: curves_db
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-auth
              key: POSTGRES_PASSWORD
        - name: DATABASE_DSN
          value: postgresql://$(PG_USER):$(POSTGRES_PASSWORD)@$(PG_HOST):$(PG_PORT)/$(PG_DB)
        ports:
        - name: http
          containerPort: 8000
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 30
