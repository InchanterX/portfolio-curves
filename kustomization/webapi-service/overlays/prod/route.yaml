apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: webapi-service
spec:
  parentRefs:
  - name: home-gateway
    namespace: default
  hostnames:
  - curves-prod.faberge-eggs.ru
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api
    backendRefs:
    - name: webapi-service
      port: 8000
