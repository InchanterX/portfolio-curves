apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: metabase
spec:
  parentRefs:
  - name: home-gateway
    namespace: default
  hostnames:
  - curves-prod.faberge-eggs.ru
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: metabase
      port: 3000
