apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: curves-migrations-prod
spec:
  limits:
  - type: Container
    min:
      cpu: 10m
      memory: 16Mi
    max:
      cpu: '2'
      memory: 2Gi
    default:
      cpu: '1'
      memory: 512Mi
    defaultRequest:
      cpu: 100m
      memory: 128Mi
  - type: PersistentVolumeClaim
    min:
      storage: 1Gi
    max:
      storage: 10Gi
