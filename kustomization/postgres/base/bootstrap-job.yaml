apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-bootstrap
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: '1'
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-bootstrap
        app.kubernetes.io/part-of: curves
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
      - name: bootstrap
        image: postgres:18.6
        command:
        - sh
        - -ec
        args:
        - 'i=0; until pg_isready -q; do i=$((i+1)); [ "$i" -lt 60 ] || exit 1; sleep
          2; done

          exec psql -X -q -f /bootstrap/bootstrap.sql

          '
        env:
        - name: PGHOST
          value: postgres
        - name: PGDATABASE
          value: curves_db
        - name: PGUSER
          value: curves
        - name: PGCONNECT_TIMEOUT
          value: '3'
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-auth
              key: POSTGRES_PASSWORD
        - name: MIGRATOR_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-bootstrap
              key: MIGRATOR_PASSWORD
        - name: COLLECTOR_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-bootstrap
              key: COLLECTOR_PASSWORD
        - name: READER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-bootstrap
              key: READER_PASSWORD
        - name: METABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-bootstrap
              key: METABASE_PASSWORD
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: bootstrap
          mountPath: /bootstrap
          readOnly: true
      volumes:
      - name: bootstrap
        configMap:
          name: postgres-bootstrap-sql
