apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- statefulset.yaml
- postgres-service.yaml
- postgres-headless-service.yaml
- pvc.yaml
- bootstrap-job.yaml
configMapGenerator:
- name: postgres-bootstrap-sql
  files:
  - bootstrap.sql
generatorOptions:
  disableNameSuffixHash: true
