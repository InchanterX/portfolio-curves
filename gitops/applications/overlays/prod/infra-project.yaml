apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: curves-infra-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-3'
spec:
  sourceRepos:
  - https://github.com/InchanterX/portfolio-curves.git
  destinations:
  - server: https://kubernetes.default.svc
    namespace: curves-postgres-prod
  - server: https://kubernetes.default.svc
    namespace: curves-analyzer-service-prod
  - server: https://kubernetes.default.svc
    namespace: curves-webapi-service-prod
  - server: https://kubernetes.default.svc
    namespace: curves-frontend-prod
  - server: https://kubernetes.default.svc
    namespace: curves-collector-job-prod
  - server: https://kubernetes.default.svc
    namespace: curves-migrations-prod
  orphanedResources:
    warn: true
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
  namespaceResourceWhitelist:
  - group: ''
    kind: LimitRange
  - group: ''
    kind: ResourceQuota
