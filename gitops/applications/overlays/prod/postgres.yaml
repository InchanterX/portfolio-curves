apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: curves-postgres-prod
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  project: curves-services-prod
  source:
    repoURL: https://github.com/InchanterX/portfolio-curves.git
    targetRevision: main
    path: kustomization/postgres/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: curves-postgres-prod
  revisionHistoryLimit: 5
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
