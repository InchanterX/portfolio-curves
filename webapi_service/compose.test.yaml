services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: curves_webapi_test
      POSTGRES_USER: webapi_test
      POSTGRES_PASSWORD: isolated-test-only
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ./tests/schema.sql:/docker-entrypoint-initdb.d/001-test-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webapi_test -d curves_webapi_test"]
      interval: 2s
      timeout: 2s
      retries: 30
