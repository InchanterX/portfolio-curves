[project]
name = "curves-collector"
version = "0.1.0"
requires-python = ">=3.13,<3.15"
dependencies = ["psycopg[binary]>=3.3,<4"]

[project.scripts]
curves-collector = "curves_collector.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curves_collector"]

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.14"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a disposable PostgreSQL database"]
